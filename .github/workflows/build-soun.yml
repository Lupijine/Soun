name: Build Soun APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-soun.yml

permissions:
  contents: write

concurrency:
  group: soun-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5
      - name: Check signing configuration
        env:
          SIGNING_KEYSTORE: ${{ secrets.SOUN_KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SOUN_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ] || [ -z "$SIGNING_STORE_PASSWORD" ]; then
            echo "::error::Release signing secrets SOUN_KEYSTORE and SOUN_KEYSTORE_PASSWORD are required."
            exit 1
          fi
      - name: Build release APK
        run: ./gradlew --console=plain :app:assembleFossRelease
        env:
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      - name: Sign release APK
        env:
          SIGNING_KEYSTORE: ${{ secrets.SOUN_KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SOUN_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/soun-keystore.XXXXXX")"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk soun-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE_PATH" --ks-pass env:SIGNING_STORE_PASSWORD --out soun.apk soun-aligned.apk
          "$BUILD_TOOLS/apksigner" verify soun.apk
      - name: Publish APK in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="soun-${GITHUB_SHA:0:7}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" soun.apk --clobber
          else
            gh release create "$TAG" soun.apk \
              --target "$GITHUB_SHA" \
              --title "Soun build ${GITHUB_SHA:0:7}" \
              --notes "Release APK for com.lupijine.soun, built from $GITHUB_SHA."
          fi
