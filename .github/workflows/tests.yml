name: Unit tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5
      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --console=plain --continue :app:testFossDebugUnitTest :innertube:test
      - name: Test report summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          total = failed = 0
          for f in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              r = ET.parse(f).getroot()
              for tc in r.iter('testcase'):
                  total += 1
                  bad = tc.find('failure') if tc.find('failure') is not None else tc.find('error')
                  if bad is not None:
                      failed += 1
                      msg = (bad.get('message') or '').splitlines()[0][:300] if bad.get('message') else ''
                      print(f"FAILED {tc.get('classname')}.{tc.get('name')}: {msg}")
          print(f"{total} tests, {failed} failed")
          EOF
